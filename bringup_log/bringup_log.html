<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EE372B Bring-Up Log</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317181a'/%3E%3Cpolyline points='8,16.5 13.5,22 24,10' fill='none' stroke='%233fbf7f' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f4f2; --panel: #ffffff; --ink: #17181a; --dim: #75777c; --rule: #dcdcd8;
  --fill: #ececea; --on: #1f7a4d; --on-bg: #eaf4ee; --warn: #9a5b00; --stop: #c62828;
  --well: rgba(0,0,0,.035); --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1011; --panel: #17181a; --ink: #e9e9e6; --dim: #8b8d91; --rule: #2a2b2e;
    --fill: #222326; --on: #3fbf7f; --on-bg: #14211a; --warn: #e8b35a; --stop: #e5484d; --well: rgba(0,0,0,.22);
  }
}
:root[data-theme="dark"] {
  --bg: #0f1011; --panel: #17181a; --ink: #e9e9e6; --dim: #8b8d91; --rule: #2a2b2e;
  --fill: #222326; --on: #3fbf7f; --on-bg: #14211a; --warn: #e8b35a; --stop: #e5484d; --well: rgba(0,0,0,.22);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
}
header {
  display: flex; justify-content: space-between; align-items: center; gap: 24px;
  padding: 12px 24px; border-bottom: 1px solid var(--rule); background: var(--panel);
  position: sticky; top: 0; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }
.name { font-weight: 650; font-size: 14px; letter-spacing: 0.01em; white-space: nowrap; }
.progress { display: flex; align-items: center; gap: 10px; flex: 1; }
.count { color: var(--dim); font-family: var(--mono); font-size: 11px; white-space: nowrap; }
.bar { flex: 1; height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--on); transition: width .3s; }
.saved { color: var(--on); font-family: var(--mono); font-size: 11px; opacity: 0; transition: opacity .4s; }
.saved.show { opacity: 1; }
.tools { display: flex; gap: 10px; }
button.icon {
  width: 38px; height: 38px; display: inline-grid; place-items: center; padding: 0;
  color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 5px; cursor: pointer;
}
button.icon:hover { border-color: var(--dim); }
button.icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.i-sun { display: none; }
:root[data-theme="dark"] .i-sun { display: block; }
:root[data-theme="dark"] .i-moon { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) .i-sun { display: block; }
  :root:not([data-theme]) .i-moon { display: none; }
}
.wrap { max-width: 1700px; margin: 0 auto; padding: 16px 24px 48px; }
.filters { display: flex; gap: 6px; margin-bottom: 16px; }
.filters button {
  font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
  border-radius: 5px; padding: 6px 12px; cursor: pointer;
}
.filters button:hover { border-color: var(--dim); }
.filters button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }

.test {
  background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
  margin-bottom: 16px; display: grid; grid-template-columns: 7fr 3fr; overflow: hidden;
}
.test.done { background: var(--on-bg); }
.left { padding: 14px 16px 16px; }
.top { display: flex; align-items: flex-start; gap: 12px; }
.check {
  flex: none; width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid var(--dim);
  background: var(--panel); cursor: pointer; display: grid; place-items: center; padding: 0; margin-top: 1px;
}
.check svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3.2; fill: none; opacity: 0; }
.done .check { background: var(--on); border-color: var(--on); }
.done .check svg { opacity: 1; }
.titlewrap { flex: 1; min-width: 0; }
.title { font-weight: 650; font-size: 15px; position: relative; display: inline-block; }
.num { color: var(--dim); font-family: var(--mono); font-size: 12px; margin-right: 8px; }
.done .title { color: var(--dim); }
.done .title::after { content: ""; position: absolute; left: 0; right: 0; top: 0.72em; height: 1px; background: var(--dim); }
.meta { font-size: 11px; color: var(--dim); font-family: var(--mono); margin-top: 2px; display: flex; gap: 12px; flex-wrap: wrap; }
.flag { margin-left: 4px; flex: none; background: transparent; border: 0; cursor: pointer; color: var(--dim); opacity: .35; padding: 2px; line-height: 0; }
.flag svg { width: 18px; height: 18px; fill: currentColor; }
.flag.on { color: var(--warn); opacity: 1; }

.rows { margin-top: 12px; display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 72px 1fr; gap: 8px; font-size: 13px; }
.row > b { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); padding-top: 2px; font-weight: 600; }
.done .rows { opacity: .65; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chips .lab { font-size: 11px; color: var(--dim); margin-right: 6px; }
.chips .lab.gap { margin-left: 18px; }
.chip { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--fill); border: 1px solid var(--rule); }
.chip.fit { border-color: var(--on); color: var(--on); background: transparent; }
.chip.pull { border-color: var(--stop); color: var(--stop); background: transparent; }
.chip.plain { font-family: inherit; font-size: 12px; }
.chip.fit, .chip.pull { cursor: zoom-in; }
.chip.fit:hover { background: var(--on-bg); }
.chip.pull:hover { background: rgba(229,72,77,.1); }
.pcbview { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: grid; place-items: center; z-index: 50; cursor: zoom-out; padding: 16px; }
.pcbview .stage { position: relative; width: min(94vh, 94vw); aspect-ratio: 1; }
.pcbview img, .pcbview svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pcbview text { font: 700 34px var(--mono); paint-order: stroke; stroke: rgba(0,0,0,.85); stroke-width: 7px; }
.jump { font-size: 12px; color: var(--dim); margin-top: 4px; }
table.exp { justify-self: start; border-collapse: collapse; font-size: 12.5px; }
table.exp th { font-size: 11px; font-weight: 500; color: var(--dim); text-align: left; padding: 0 16px 3px 0; }
table.exp td { padding: 2px 16px 2px 0; border-top: 1px solid var(--rule); }
table.exp td:not(:first-child) { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

.pair { display: flex; gap: 32px; overflow-x: auto; }
.pair .row { grid-template-columns: 72px auto; }
table.exp th:first-child, table.exp td:first-child { min-width: 120px; white-space: nowrap; }
table.exp th:not(:first-child), table.exp td:not(:first-child) { min-width: 96px; }
table.exp.meas th:first-child, table.exp.meas td:first-child { min-width: 96px; }
.mi {
  width: 96px; font: inherit; line-height: inherit; font-family: var(--mono); font-size: 12.5px; color: var(--ink);
  background: transparent; border: 0; border-bottom: 1px dashed var(--rule); padding: 0 0 1px; outline: none;
}
.mi:focus { border-bottom: 1px solid var(--on); }
.photobtn {
  flex: none; margin-left: auto; height: 28px; padding: 0 8px; display: inline-flex; align-items: center; gap: 5px;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 5px; color: var(--dim); cursor: pointer;
  font-family: var(--mono); font-size: 11px;
}
.photobtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.photobtn:hover, .photobtn.on { color: var(--ink); border-color: var(--dim); }
.pc:empty { display: none; }
.tray { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 12px; }
.shots { display: flex; flex-wrap: wrap; gap: 12px; }
.shot { margin: 0; width: 200px; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; background: var(--panel); position: relative; }
.shot img { display: block; width: 100%; height: 130px; object-fit: cover; cursor: zoom-in; background: var(--fill); }
.cap-in { width: 100%; border: 0; border-top: 1px solid var(--rule); padding: 6px 8px; font: inherit; font-size: 12px; background: var(--panel); color: var(--ink); outline: none; }
.cap-in::placeholder { color: var(--dim); }
.shot-act { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
.shot:hover .shot-act { opacity: 1; }
.shot-act button { width: 26px; height: 26px; border-radius: 5px; border: 0; background: rgba(0,0,0,.6); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
.shot-act svg, .drop svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.shot-act svg { width: 14px; height: 14px; }
.drop {
  width: 200px; min-height: 162px; border: 1.5px dashed var(--rule); border-radius: 5px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px; color: var(--dim); font-size: 12px; text-align: center; padding: 12px; cursor: pointer;
}
.drop svg { width: 22px; height: 22px; }
.drop:hover, .tray.over .drop { border-color: var(--on); color: var(--on); }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; z-index: 50; cursor: zoom-out; padding: 24px; }
.lightbox img { max-width: 95vw; max-height: 85vh; border-radius: 4px; }
.lb-cap { color: #eee; font-size: 13px; }
.lb-cap { white-space: pre; }
.lb-nav { position: fixed; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: 0;
  background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
.lb-nav:hover:not(:disabled) { background: rgba(255,255,255,.25); }
.lb-nav:disabled { opacity: .3; cursor: default; }
.lb-nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.lb-prev { left: 20px; }
.lb-next { right: 20px; }
.notes { border-left: 1px solid var(--rule); padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.notes textarea {
  flex: 1 0 auto; width: 100%; min-height: 140px; resize: vertical;
  border: 1px solid var(--rule); border-radius: 5px; background: var(--well); color: var(--ink);
  font: inherit; font-size: 13px; padding: 8px 10px; outline: none;
}
.notes textarea:focus { border-color: var(--dim); }
.notes textarea::placeholder { color: var(--dim); }
.stamp { font-size: 11px; color: var(--dim); font-family: var(--mono); min-height: 16px; }
.general { grid-template-columns: 1fr; }
.general h2 { font-size: 13px; font-weight: 650; margin: 0; padding: 14px 16px 0; }
.general .notes { border-left: 0; }

@media (max-width: 720px) {
  .test { grid-template-columns: 1fr; }
  .notes { border-left: 0; border-top: 1px solid var(--rule); }
  .progress { display: none; }
}
@media print {
  header .tools, .filters, .flag { display: none; }
  .test { break-inside: avoid; }
}
</style>
</head>

</div>

  const base = (p.caption || p.name.replace(/\.[A-Za-z0-9]+$/, "")).replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "_");
  return (base || "photo") + ext;
}
function lightbox(p) {
  const set = photos.filter(x => x.test === p.test).sort((a, b) => a.added - b.added);
  let k = Math.max(0, set.findIndex(x => x.id === p.id));
  const lb = document.createElement("div");
  lb.className = "lightbox";
  const multi = set.length > 1;
  lb.innerHTML = `<button class="lb-nav lb-prev" title="Previous (←)"${multi ? "" : " disabled"}><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <img alt=""><div class="lb-cap"></div>
    <button class="lb-nav lb-next" title="Next (→)"${multi ? "" : " disabled"}><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>`;
  const img = lb.querySelector("img"), cap = lb.querySelector(".lb-cap");
  const show = () => {
    const q = set[k];
    img.src = urlFor(q);
    cap.textContent = (q.caption ? toMu(q.caption) + "   " : "") + `${k + 1} / ${set.length}`;
  };
  const step = d => { k = (k + d + set.length) % set.length; show(); };
  const close = () => { lb.remove(); document.removeEventListener("keydown", keys); };
  const keys = e => {
    if (e.key === "Escape") close();
    else if (multi && e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    else if (multi && e.key === "ArrowRight") { e.preventDefault(); step(1); }
  };
  lb.addEventListener("click", e => { if (e.target === lb || e.target === img) close(); });
  if (multi) {
    lb.querySelector(".lb-prev").addEventListener("click", e => { e.stopPropagation(); step(-1); });
    lb.querySelector(".lb-next").addEventListener("click", e => { e.stopPropagation(); step(1); });
  }
  document.addEventListener("keydown", keys);
  document.body.appendChild(lb);
  show();
}
function expandRefs(items) {
  const out = [];
  for (const x of items) {
    const m = /^([A-Z]+)(\d+)(?:-[A-Z]*(\d+))?/.exec(x);
    if (!m) continue;
    for (let k = +m[2]; k <= +(m[3] || m[2]); k++) out.push(m[1] + k);
  }
  return out;
}
function pcbView(T) {
  if (typeof PCB === "undefined") return;
  const pv = document.createElement("div");
  pv.className = "pcbview";
  const parts = [...expandRefs(T.fit).map(r => [r, "#3fbf7f"]), ...expandRefs(T.pull).map(r => [r, "#e5484d"])]
    .filter(([r]) => PCB.boxes[r]).map(([r, col]) => { const [a, b, c, d] = PCB.boxes[r]; return { r, col, b: [a + 10, b + 10, c - 10, d - 10] }; });
  const FS = 34, G = 8, taken = parts.map(p => p.b);
  const hit = q => q[0] < 0 || q[1] < 0 || q[2] > PCB.w || q[3] > PCB.h || taken.some(t => q[0] < t[2] && t[0] < q[2] && q[1] < t[3] && t[1] < q[3]);
  parts.forEach(p => {
    const w = p.r.length * FS * 0.62, [a, b, c, d] = p.b, cx = (a + c) / 2, cy = (b + d) / 2;
    const spots = [[c + G, cy - FS / 2], [a - w - G, cy - FS / 2], [cx - w / 2, b - FS - G], [cx - w / 2, d + G]];
    const s = spots.find(([x, y]) => !hit([x, y, x + w, y + FS])) || spots[0];
    taken.push([s[0], s[1], s[0] + w, s[1] + FS]);
    p.tx = s[0] + w / 2; p.ty = s[1] + FS * 0.82;
  });
  const holes = parts.map(({ b: [a, b, c, d] }) => `<rect x="${a}" y="${b}" width="${c - a}" height="${d - b}" rx="5" fill="#000"/>`).join("");
  const marks = parts.map(({ r, col, b: [a, b, c, d], tx, ty }) =>
    `<rect x="${a}" y="${b}" width="${c - a}" height="${d - b}" rx="5" fill="${col}" fill-opacity=".18" stroke="${col}" stroke-width="5"/>` +
    `<text x="${tx}" y="${ty}" text-anchor="middle" fill="${col}">${r}</text>`).join("");
  pv.innerHTML = `<div class="stage"><img alt="" src="${PCB_IMG}">
    <svg viewBox="0 0 ${PCB.w} ${PCB.h}"><mask id="pv-m"><rect width="${PCB.w}" height="${PCB.h}" fill="#fff"/>${holes}</mask>
    <rect width="${PCB.w}" height="${PCB.h}" fill="#000" fill-opacity=".45" mask="url(#pv-m)"/>${marks}</svg></div>`;
  const close = () => { pv.remove(); document.removeEventListener("keydown", keys); };
  const keys = e => { if (e.key === "Escape") close(); };
  pv.addEventListener("click", close);
  document.addEventListener("keydown", keys);
  document.body.appendChild(pv);
}
const capTimers = {};
function fillTray(el, i) {
  const mine = photos.filter(p => p.test === i).sort((a, b) => a.added - b.added);
  el.querySelector(".pc").textContent = mine.length || "";
  const tray = el.querySelector(".tray");
  if (tray.hidden) return;
  if (dbErr) { tray.innerHTML = '<div class="drop">This browser will not store pictures for a local file.</div>'; return; }
  tray.innerHTML = `<div class="shots">${mine.map(p => `
    <figure class="shot" data-id="${p.id}">
      <img src="${urlFor(p)}" alt="">
      <input class="cap-in" data-id="${p.id}" placeholder="caption..." spellcheck="false">
      <div class="shot-act"><button class="dl" title="Download">${DL}</button><button class="rm" title="Delete">${XX}</button></div>
    </figure>`).join("")}
    <label class="drop">${PLUS}<span>Drop, paste, or click to add pictures</span><input type="file" accept="image/*" multiple hidden></label></div>`;
  tray.querySelectorAll(".shot").forEach(fig => {
    const p = photos.find(x => x.id === fig.dataset.id);
    const cap = fig.querySelector(".cap-in");
    cap.value = toMu(p.caption || "");
    cap.addEventListener("focus", () => { cap.value = p.caption || ""; });
    cap.addEventListener("blur", () => { cap.value = toMu(p.caption || ""); });
    cap.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); cap.blur(); } });
    cap.addEventListener("input", () => {
      p.caption = cap.value;
      clearTimeout(capTimers[p.id]);
      capTimers[p.id] = setTimeout(() => tx("readwrite", st => st.put(p)).then(() => { savedEl.classList.add("show"); setTimeout(() => savedEl.classList.remove("show"), 900); }), 300);
    });
    fig.querySelector("img").addEventListener("click", () => lightbox(p));
    fig.querySelector(".dl").addEventListener("click", () => {
      const a = document.createElement("a"); a.href = urlFor(p); a.download = fileName(p); a.click();
    });
    fig.querySelector(".rm").addEventListener("click", async () => {
      if (!confirm("Delete this picture?")) return;
      await tx("readwrite", st => st.delete(p.id));
      photos = photos.filter(x => x.id !== p.id);
      if (urls.has(p.id)) { URL.revokeObjectURL(urls.get(p.id)); urls.delete(p.id); }
      render();
    });
  });
  const picker = tray.querySelector(".drop input");
  picker.addEventListener("change", () => { addFiles(i, picker.files); });
  tray.addEventListener("click", () => { lastTray = i; });
  tray.addEventListener("dragover", e => { e.preventDefault(); tray.classList.add("over"); });
  tray.addEventListener("dragleave", e => { if (!tray.contains(e.relatedTarget)) tray.classList.remove("over"); });
  tray.addEventListener("drop", e => { e.preventDefault(); tray.classList.remove("over"); addFiles(i, e.dataTransfer.files); });
}
document.addEventListener("paste", e => {
  if (lastTray === null || !openTrays.has(lastTray)) return;
  const files = [...(e.clipboardData ? e.clipboardData.files : [])].filter(f => f.type.startsWith("image/"));
  if (!files.length) return;
  e.preventDefault(); addFiles(lastTray, files);
});
const toDataURL = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
function fromDataURL(d) {
  const [head, body] = d.split(",");
  const type = (head.match(/data:([^;]+)/) || [, "image/png"])[1];
  const bin = atob(body); const u = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
  return new Blob([u], { type });
}

const bullets = t => toMu(t.replace(/^(\s*)- /gm, "$1• "));
function noteBox(ta, get, set) {
  ta.value = bullets(get());
  ta.addEventListener("focus", () => { ta.value = get(); });
  ta.addEventListener("blur", () => { ta.value = bullets(get()); });
  ta.addEventListener("keydown", e => {
    if (e.key !== "Enter" || e.shiftKey) return;
    const v = ta.value, c = ta.selectionStart;
    const start = v.lastIndexOf("\n", c - 1) + 1;
    let end = v.indexOf("\n", c); if (end < 0) end = v.length;
    if (v.slice(start, end).trim() !== "") return;
    e.preventDefault();
    const nv = v.slice(0, Math.max(0, start - 1)) + v.slice(end);
    ta.value = nv; set(nv); save(); ta.blur();
  });
}

function render() {
  list.innerHTML = "";
  TESTS.forEach((T, i) => {
    const s = state.tests[i];
    const el = document.createElement("div");
    el.className = "test" + (s.done ? " done" : "");
    el.dataset.i = i;
    el.innerHTML = `
      <div class="left">
        <div class="top">
          <button class="check" aria-label="Mark done">${CHECK}</button>
          <div class="titlewrap">
            <div><span class="num">${String(i + 1).padStart(2, "0")}</span><span class="title">${T.t}</span></div>
            <div class="meta">${s.done ? `<span>done ${fmt(s.doneAt)}</span>` : ""}</div>
          </div>
          <button class="photobtn${openTrays.has(i) ? " on" : ""}" title="Photos">${CAM}<span class="pc"></span></button>
          <button class="flag${s.flag ? " on" : ""}" title="Flag to come back to">${FLAG}</button>
        </div>
        <div class="rows">
          <div class="row"><b>PCB</b><div>
            <div class="chips"><span class="lab">Populate:</span><span class="chip fit">${refs(T.fit)}</span><span class="lab gap">Unpopulate:</span><span class="chip pull">${refs(T.pull)}</span></div>
            ${T.jumpers ? `<div class="jump">${T.jumpers}</div>` : ""}
          </div></div>
          <div class="row"><b>Bench</b><div class="chips">${T.bench.map(x => `<span class="chip plain">${x}</span>`).join("")}</div></div>
          <div class="pair">
          <div class="row"><b>Expected</b><table class="exp"><tr><th></th><th>${(T.cols || ["MD 1", "MD 0"])[0]}</th><th>${(T.cols || ["MD 1", "MD 0"])[1]}</th></tr>${T.exp.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table></div>
          <div class="row"><b>Measured</b><table class="exp meas"><tr><th>${(T.cols || ["MD 1", "MD 0"])[0]}</th><th>${(T.cols || ["MD 1", "MD 0"])[1]}</th></tr>${T.exp.map((r, ri) => `<tr>${[1, 2].map(ci => `<td><input class="mi" data-k="${ri},${ci}" spellcheck="false"></td>`).join("")}</tr>`).join("")}</table></div>
          </div>
        </div>
        <div class="tray"${openTrays.has(i) ? "" : " hidden"}></div>
      </div>
      <div class="notes">
        <textarea placeholder="notes..." spellcheck="false"></textarea>
        <div class="stamp">${s.editedAt ? "edited " + fmt(s.editedAt) : ""}</div>
      </div>`;
    const ta = el.querySelector("textarea");
    noteBox(ta, () => s.notes || "", v => { s.notes = v; });
    ta.addEventListener("input", () => {
      s.notes = ta.value; s.editedAt = Date.now();
      el.querySelector(".stamp").textContent = "edited " + fmt(s.editedAt);
      save();
    });
    el.querySelector(".check").addEventListener("click", () => {
      s.done = !s.done; s.doneAt = s.done ? Date.now() : null;
      save(); render();
    });
    el.querySelector(".flag").addEventListener("click", () => { s.flag = !s.flag; save(); render(); });
    el.querySelectorAll(".chip.fit, .chip.pull").forEach(c => c.addEventListener("click", () => pcbView(T)));
    el.querySelector(".photobtn").addEventListener("click", () => {
      if (openTrays.has(i)) openTrays.delete(i); else { openTrays.add(i); lastTray = i; }
      render();
    });
    fillTray(el, i);
    s.meas = s.meas || {};
    el.querySelectorAll(".mi").forEach(inp => {
      const raw = () => s.meas[inp.dataset.k] || "";
      inp.value = toMu(raw());
      inp.addEventListener("focus", () => { inp.value = raw(); });
      inp.addEventListener("blur", () => { inp.value = toMu(raw()); });
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); inp.blur(); } });
      inp.addEventListener("input", () => { s.meas[inp.dataset.k] = inp.value; save(); });
    });
    list.appendChild(el);
  });
  const n = state.tests.filter(s => s.done).length;
  document.getElementById("count").textContent = `${n} / ${TESTS.length} done`;
  document.getElementById("bar").style.width = (100 * n / TESTS.length) + "%";
  applyFilter();
}

let filter = "all";
function applyFilter() {
  list.querySelectorAll(".test").forEach(el => {
    const s = state.tests[+el.dataset.i];
    const show = filter === "all" || (filter === "done" && s.done) || (filter === "todo" && !s.done) || (filter === "flag" && s.flag);
    el.style.display = show ? "" : "none";
  });
}
document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".filters button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); filter = b.dataset.f; applyFilter();
}));

const gen = document.getElementById("general");
const genStamp = document.getElementById("general-stamp");
noteBox(gen, () => state.general || "", v => { state.general = v; });
genStamp.textContent = state.generalAt ? "edited " + fmt(state.generalAt) : "";
gen.addEventListener("input", () => {
  state.general = gen.value; state.generalAt = Date.now();
  genStamp.textContent = "edited " + fmt(state.generalAt); save();
});

function setTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
setTheme(state.theme);
document.getElementById("theme").addEventListener("click", () => {
  const dark = state.theme ? state.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  state.theme = dark ? "light" : "dark"; setTheme(state.theme); save();
});

document.getElementById("export").addEventListener("click", async () => {
  const pics = await Promise.all(photos.map(async p => ({ id: p.id, test: p.test, caption: p.caption, name: p.name, type: p.type, added: p.added, data: await toDataURL(p.blob) })));
  const blob = new Blob([JSON.stringify(Object.assign({}, state, { photos: pics }), null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bringup_log_" + new Date().toISOString().slice(0, 10) + ".json";
  a.click(); URL.revokeObjectURL(a.href);
});
const file = document.getElementById("file");
document.getElementById("import").addEventListener("click", () => file.click());
file.addEventListener("change", async () => {
  const f = file.files[0]; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!Array.isArray(s.tests) || s.tests.length !== TESTS.length) throw new Error("bad file");
    if (!confirm("Replace the current checks, notes, and pictures with this backup?")) return;
    const pics = Array.isArray(s.photos) ? s.photos : null;
    delete s.photos;
    state = s; save();
    if (pics && db) {
      await tx("readwrite", st => st.clear());
      urls.forEach(u => URL.revokeObjectURL(u)); urls.clear();
      photos = pics.map(q => ({ id: q.id, test: q.test, caption: q.caption || "", name: q.name, type: q.type, added: q.added, blob: fromDataURL(q.data) }));
      for (const q of photos) await tx("readwrite", st => st.put(q));
    }
    render(); gen.value = bullets(state.general || ""); setTheme(state.theme);
  } catch (e) { alert("That file is not a bring-up log backup."); }
  file.value = "";
});

render();
loadPhotos();
</script>
